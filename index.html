<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snap Smart – Sistema de gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b12;--pn:#121624;--ln:#232a3f;--tx:#eef1f9;--mu:#8e98b3;--az:#2f6bff;--ok:#2fd08a;--rd:#ff6b78;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f1f4fb;--pn:#fff;--ln:#dbe1ef;--tx:#0e1220;--mu:#5a6482;--ok:#0f9d63;--rd:#d63a4a;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Sora,system-ui,sans-serif;min-height:100vh}
.w{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header img{width:56px;height:56px;border-radius:50%;flex:none}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.5px}
header small{color:var(--mu)}
.dm{margin-left:auto;background:var(--az);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
nav button{flex:none;background:var(--pn);color:var(--mu);border:1px solid var(--ln);border-radius:10px;padding:10px 16px;font:600 14px Sora,system-ui,sans-serif;cursor:pointer}
nav button.on{background:var(--az);border-color:var(--az);color:#fff}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.c h2{font-size:16px;margin:0 0 12px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.st div{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.st b{display:block;font-size:22px;font-weight:800}.st span{color:var(--mu);font-size:13px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:400 15px Sora,system-ui,sans-serif}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--az);outline-offset:2px}
.b{background:var(--az);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:600 15px Sora,system-ui,sans-serif;cursor:pointer}
.b:disabled{opacity:.4;cursor:not-allowed}
.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}
.t{color:var(--mu);font-size:13px}
.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.er{background:color-mix(in srgb,var(--rd) 15%,transparent);color:var(--rd);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.nt{border-left:3px solid var(--az);padding:8px 12px;color:var(--mu);margin-bottom:14px;font-size:14px}
.tot{font-size:26px;font-weight:800;margin:12px 0}
.tg{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--az) 22%,transparent);color:var(--az)}
.in{color:var(--ok)}.out{color:var(--rd)}
#ch{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.m{max-width:82%;padding:9px 13px;border-radius:14px;font-size:14px}
.m.u{align-self:flex-end;background:var(--az);color:#fff;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:var(--bg);border:1px solid var(--ln);border-bottom-left-radius:4px}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ch button{background:transparent;color:var(--tx);border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font:400 13px Sora,system-ui,sans-serif;cursor:pointer}
.sd{display:flex;gap:8px}
@media(prefers-reduced-motion:no-preference){.ok{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(-4px)}}}
</style></head><body><div class="w">

<script>
const R=v=>'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let k=0;const im=()=>'3569'+String(++k*7919).padStart(11,'0');
let T='est',msg='',err='',vp=0,vc='';
const P=[{n:'iPhone 15 128 GB',p:4299,ims:[im(),im(),im()]},{n:'Galaxy S24 256 GB',p:3899,ims:[im(),im()]},{n:'Redmi Note 13',p:1399,ims:[im(),im(),im(),im(),im(),im()]},{n:'Moto G54',p:1199,ims:[im(),im(),im(),im()]},{n:'Capa transparente iPhone 15',c:'Capas',p:49,q:12},{n:'Capa antichoque Galaxy S24',c:'Capas',p:59,q:8},{n:'Película de vidro 3D',c:'Películas',p:39,q:20},{n:'Película de hidrogel',c:'Películas',p:29,q:15},{n:'Caixa de som Bluetooth',c:'Som',p:149,q:6},{n:'Fone Bluetooth',c:'Som',p:129,q:8},{n:'Suporte veicular magnético',c:'Suportes',p:59,q:10},{n:'Suporte de mesa articulado',c:'Suportes',p:45,q:7},{n:'Carregador 20W USB-C',c:'Carregadores',p:79,q:15},{n:'Cabo USB-C 1 m',c:'Carregadores',p:29,q:25}];
let AF='Todos';
let MV=[],VN=[],NF=[],C=[{w:'b',t:'Olá! Eu sou o atendimento da Snap Smart. Como posso ajudar?'}];
const qt=p=>p.ims?p.ims.length:p.q;
const hr=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const mv=(t,i,d)=>MV.unshift({h:hr(),t,i,d});
function r(){
 $('#nv').innerHTML=[['est','Estoque'],['ac','Acessórios'],['ven','Vendas'],['nf','Notas fiscais'+(NF.length?' ('+NF.length+')':'')],['ia','Atendimento IA']].map(([a,l])=>`<button class="${T==a?'on':''}" onclick="T='${a}';r()">${l}</button>`).join('');
 $('#mn').innerHTML=(msg?`<div class="ok">${msg}</div>`:'')+(err?`<div class="er">${err}</div>`:'')+({est,ac,ven,nf,ia})[T]();
 msg=err='';if(T=='ia')cd();
}
function est(){
 const un=P.reduce((a,p)=>a+qt(p),0),vl=P.reduce((a,p)=>a+qt(p)*p.p,0);
 return `<div class="st"><div><b>${un}</b><span>itens em estoque</span></div><div><b>${R(vl)}</b><span>valor em estoque</span></div><div><b>${VN.length}</b><span>vendas feitas</span></div></div>
<div class="c"><h2>Registrar entrada</h2><div class="fm"><div><label>Produto</label><input id="en" list="pl" placeholder="Ex.: iPhone 15 128 GB"><datalist id="pl">${P.map(p=>`<option value="${E(p.n)}">`).join('')}</datalist></div><div><label>Preço de venda</label><input id="ep" type="number" min="0" placeholder="0,00"></div><div><label>IMEI (aparelhos)</label><input id="ei" inputmode="numeric" placeholder="15 dígitos"></div><div><label>Quantidade (acessórios)</label><input id="eq" type="number" min="1" value="1"></div><button class="b" onclick="ent()">Registrar entrada</button></div></div>
<div class="c"><h2>Aparelhos</h2><div class="tb"><table><tr><th>Produto</th><th>Preço (editável)</th><th>Em estoque</th></tr>${P.map((p,i)=>!p.ims?'':`<tr><td>${E(p.n)}</td><td><input type='number' min='0' value='${p.p}' style='width:110px' onchange='edp(${i},this.value)'></td><td>${qt(p)==0?'<span class="out">Sem estoque</span>':qt(p)+' un.'}</td></tr>`).join('')}</table></div></div>
<div class="c"><h2>Entradas e saídas</h2>${MV.length?`<div class="tb"><table><tr><th>Hora</th><th>Tipo</th><th>Produto</th><th>Detalhe</th></tr>${MV.slice(0,8).map(m=>`<tr><td class="t">${m.h}</td><td class="${m.t=='Entrada'?'in':'out'}">${m.t}</td><td>${E(m.i)}</td><td class="t">${E(m.d)}</td></tr>`).join('')}</table></div>`:'<p class="t">Nenhuma movimentação ainda. Registre uma entrada ou faça uma venda.</p>'}</div>`;
}
function ent(){
 const n=$('#en').value.trim(),pr=+$('#ep').value,i=$('#ei').value.trim(),q=Math.max(1,+$('#eq').value||1);
 if(!n){err='Informe o nome do produto.';return r()}
 let p=P.find(x=>x.n.toLowerCase()==n.toLowerCase());
 if(!p){p=i?{n,p:pr,ims:[]}:{n,p:pr,q:0,c:'Outros'};P.push(p)}else if(pr)p.p=pr;
 if(p.ims){if(!i){err='Este aparelho precisa de IMEI.';return r()}p.ims.push(i);mv('Entrada',p.n,'IMEI '+i)}
 else{p.q+=q;mv('Entrada',p.n,'+'+q+' un.')}
 msg='Entrada registrada: '+E(p.n);r();
}
function cats(){return ['Todos',...new Set(P.filter(p=>!p.ims).map(p=>p.c||'Outros'))]}
function setf(j){AF=cats()[j];r()}
function ac(){
 const cs=cats();if(!cs.includes(AF))AF='Todos';
 const L=P.map((p,i)=>[p,i]).filter(([p])=>!p.ims&&(AF=='Todos'||(p.c||'Outros')==AF));
 return `<div class='c'><h2>Adicionar acessório</h2><div class='fm'><div><label>Nome</label><input id='an' placeholder='Ex.: Capa antichoque iPhone 15'></div><div><label>Categoria</label><input id='ak' list='cl' placeholder='Capas, Som, Suportes…'><datalist id='cl'>${cs.slice(1).map(x=>`<option value='${E(x)}'>`).join('')}</datalist></div><div><label>Preço de venda</label><input id='ap' type='number' min='0' placeholder='0,00'></div><div><label>Quantidade</label><input id='aq' type='number' min='0' value='1'></div><button class='b' onclick='adda()'>Adicionar acessório</button></div></div>
<div class='c'><h2>Acessórios</h2><div class='ch'>${cs.map((x,j)=>`<button onclick='setf(${j})' ${x==AF?`style='border-color:var(--az);color:var(--az)'`:''}>${E(x)}</button>`).join('')}</div>${L.length?`<div class='tb'><table><tr><th>Nome</th><th>Categoria</th><th>Preço</th><th>Qtd.</th><th></th></tr>${L.map(([p,i])=>`<tr><td><input value='${E(p.n)}' style='min-width:210px' onchange='edn(${i},this.value)'></td><td><input list='cl' value='${E(p.c||'Outros')}' style='width:130px' onchange='edc(${i},this.value)'></td><td><input type='number' min='0' value='${p.p}' style='width:100px' onchange='edp(${i},this.value)'></td><td><input type='number' min='0' value='${p.q}' style='width:80px' onchange='edq(${i},this.value)'></td><td><button class='b' style='padding:8px 12px;background:var(--rd)' onclick='rm(${i})'>Excluir</button></td></tr>`).join('')}</table></div>`:`<p class='t'>Nenhum acessório nesta categoria. Adicione um acima.</p>`}<p class='t'>Altere nome, categoria, preço ou quantidade direto na tabela.</p></div>`;
}
function edn(i,v){v=v.trim();if(!v){err='O nome não pode ficar vazio.';return r()}P[i].n=v;msg='Alteração salva';r()}
function edc(i,v){P[i].c=v.trim()||'Outros';msg='Categoria atualizada';r()}
function edp(i,v){P[i].p=Math.max(0,+v||0);msg='Preço atualizado';r()}
function edq(i,v){P[i].q=Math.max(0,Math.floor(+v||0));msg='Quantidade atualizada';r()}
function rm(i){const n=P[i].n;P.splice(i,1);vp=0;msg='Acessório removido: '+E(n);r()}
function adda(){
 const n=$('#an').value.trim(),c=$('#ak').value.trim()||'Outros',pr=Math.max(0,+$('#ap').value||0),q=Math.max(0,Math.floor(+$('#aq').value||0));
 if(!n){err='Informe o nome do acessório.';return r()}
 const x=P.find(y=>!y.ims&&y.n.toLowerCase()==n.toLowerCase());
 if(x){x.q+=q;if(pr)x.p=pr}else P.push({n,c,p:pr,q});
 if(q)mv('Entrada',n,'+'+q+' un.');
 msg='Acessório salvo: '+E(n);r();
}
function ven(){
 if(!P[vp]||qt(P[vp])==0){vp=Math.max(0,P.findIndex(p=>qt(p)>0))}
 const p=P[vp],ok=p&&qt(p)>0;
 return `<div class="c"><h2>Nova venda</h2><div class="fm"><div><label>Produto</label><select onchange="vp=+this.value;r()">${P.map((x,i)=>`<option value="${i}" ${i==vp?'selected':''} ${qt(x)==0?'disabled':''}>${E(x.n)} – ${R(x.p)}${qt(x)==0?' (sem estoque)':''}</option>`).join('')}</select></div>
 <div>${ok&&p.ims?`<label>IMEI do aparelho</label><select id="vi">${p.ims.map(i=>`<option>${i}</option>`).join('')}</select>`:`<label>Quantidade</label><input id="vq" type="number" min="1" max="${ok?qt(p):1}" value="1" oninput="tt()">`}</div>
 <div><label>Cliente</label><input id="vc" value="${E(vc)}" oninput="vc=this.value" placeholder="Nome do cliente"></div>
 <div><label>Pagamento</label><select id="vg"><option>Pix</option><option>Débito</option><option>Crédito</option><option>Dinheiro</option></select></div></div>
 <p><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input id="vn" type="checkbox" checked style="width:auto"> Emitir nota fiscal</label></p>
 <div class="tot" id="tt">${ok?R(p.p):'–'}</div><button class="b" onclick="sell()" ${ok?'':'disabled'}>Finalizar venda</button></div>
 <div class="c"><h2>Últimas vendas</h2>${VN.length?`<div class="tb"><table><tr><th>Nº</th><th>Cliente</th><th>Produto</th><th>Total</th><th>Pagamento</th></tr>${VN.slice(0,6).map(v=>`<tr><td>${v.id}</td><td>${E(v.c)}</td><td>${E(v.i)}</td><td>${R(v.t)}</td><td class="t">${v.g}</td></tr>`).join('')}</table></div>`:'<p class="t">Nenhuma venda ainda. Finalize a primeira acima.</p>'}</div>`;
}
function tt(){const p=P[vp],q=+($('#vq')||{value:1}).value||1;$('#tt').textContent=R(p.p*q)}
function sell(){
 const p=P[vp];let q=1,i='';
 if(p.ims){i=$('#vi').value;p.ims.splice(p.ims.indexOf(i),1)}
 else{q=Math.max(1,+$('#vq').value||1);if(q>p.q){err='Só há '+p.q+' un. em estoque.';return r()}p.q-=q}
 const v={id:VN.length+1,c:vc.trim()||'Consumidor',i:p.n,t:p.p*q,g:$('#vg').value};VN.unshift(v);
 mv('Saída',p.n,q+' un. · venda '+v.id+(i?' · IMEI '+i:''));
 msg='Venda '+v.id+' finalizada: '+R(v.t);
 if($('#vn').checked){let kk='';for(let j=0;j<44;j++)kk+=Math.floor(Math.random()*10);NF.unshift({no:1000+NF.length+1,c:v.c,i:v.i,t:v.t,k:kk});msg+=' · nota fiscal '+NF[0].no+' emitida (simulada)'}
 vc='';r();
}
function nf(){
 return `<div class="nt">Demonstração: as notas abaixo são simuladas. Na versão definitiva, o sistema envia cada venda a um emissor autorizado pela Sefaz e guarda o XML e o PDF da nota.</div>
 <div class="c"><h2>Notas emitidas</h2>${NF.length?`<div class="tb"><table><tr><th>Nº</th><th>Cliente</th><th>Produto</th><th>Total</th><th>Chave de acesso</th><th>Situação</th></tr>${NF.map(n=>`<tr><td>${n.no}</td><td>${E(n.c)}</td><td>${E(n.i)}</td><td>${R(n.t)}</td><td class="t">${n.k.slice(0,12)}…${n.k.slice(-6)}</td><td><span class="tg">Simulada</span></td></tr>`).join('')}</table></div>`:`<p class="t">Nenhuma nota ainda. Faça uma venda com “Emitir nota fiscal” marcado.</p><button class="b" onclick="T='ven';r()">Ir para Vendas</button>`}</div>`;
}
function ia(){
 return `<div class="nt">Demonstração com respostas de exemplo. Na versão definitiva, o agente consulta o estoque real e atende pelo WhatsApp da loja.</div>
 <div class="c"><div id="ch"></div><div class="ch">${['Tem iPhone 15?','Quanto custa o Redmi Note 13?','Vocês aceitam Pix?','Quero saber do meu conserto'].map(q=>`<button onclick="sd(this.textContent)">${q}</button>`).join('')}</div>
 <div class="sd"><input id="ci" placeholder="Escreva uma mensagem" onkeydown="if(event.key=='Enter')sd()"><button class="b" onclick="sd()">Enviar</button></div></div>`;
}
function cd(){const c=$('#ch');if(!c)return;c.innerHTML=C.map(m=>`<div class="m ${m.w}">${E(m.t)}</div>`).join('');c.scrollTop=c.scrollHeight}
function sd(t){t=(t||$('#ci').value).trim();if(!t)return;C.push({w:'u',t});$('#ci').value='';cd();setTimeout(()=>{C.push({w:'b',t:rs(t)});cd()},500)}
function rs(t){
 const n=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const p=P.find(x=>x.n.toLowerCase().normalize('NFD').replace(/[^a-z0-9 ]/g,'').split(' ').some(w=>w.length>3&&w!='para'&&n.includes(w)));
 if(p)return qt(p)>0?`Temos ${p.n} em estoque (${qt(p)} un.) por ${R(p.p)}. Quer que eu reserve para você retirar na loja?`:`No momento ${p.n} está em falta. Posso avisar você quando chegar.`;
 if(/pix|cartao|parcel|pagamento|credito|debito/.test(n))return 'Aceitamos Pix, débito e crédito em até 12x. A nota fiscal é enviada por WhatsApp na hora da compra.';
 if(/conserto|assistencia|tela|bateria|reparo/.test(n))return 'Me informe o número da sua ordem de serviço que eu consulto o andamento para você.';
 if(/horario|aberto|funciona|endereco/.test(n))return 'Atendemos de segunda a sábado, das 9h às 18h.';
 return 'Não tenho essa informação agora. Vou chamar um atendente da loja para continuar com você.';
}
r();
</script></body></html>
